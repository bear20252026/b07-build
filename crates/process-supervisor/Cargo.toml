[package]
name = "process-supervisor"
version = "0.1.0"
edition = "2021"
description = "AI Work OS - 子进程监督：拉起/回收 Python sidecar（一个 crate=一类作用，无业务逻辑）"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 测试夹具二进制：跨平台、无害，只讲 lifecycle IPC；集成测试用
# env!("CARGO_BIN_EXE_extension_host_fixture") 拿到它的绝对路径。
[[bin]]
name = "extension_host_fixture"
path = "src/bin/extension_host_fixture.rs"

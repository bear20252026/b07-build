[package]
name = "cdp-transport"
version = "0.1.0"
edition = "2021"
description = "AI Work OS - CDP WebSocket 传输（一个 crate=一类作用：把 cdp-client 的纯判定落到真实 IO，仅 loopback）"

[dependencies]
cdp-client = { path = "../cdp-client" }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
# 测试用的本地假 CDP 端点（tests/fake_cdp.rs）：手写 WebSocket 握手需要
# SHA-1 与 base64。二者只在测试里用，不进产品依赖。
base64 = "0.22"
sha1 = "0.10"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

[package]
name = "awo-desktop-shell"
version = "0.1.0"
description = "AI Work OS Windows desktop shell"
authors = ["AI Work OS Development"]
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "awo_desktop_shell_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "awo-desktop-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.5.6"

[dependencies]
tauri = { version = "2.11.0" }
tauri-plugin-shell = "2.3.1"
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

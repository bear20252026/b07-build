[package]
name = "awo-desktop-shell"
version = "0.2.0"
description = "NOVA Windows desktop shell"
authors = ["NOVA Development"]
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "awo_desktop_shell_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "awo-desktop-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
base64 = "0.22"
pdf-extract = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"
rand = "0.8"
# SEC-006/007：API key 与 GitHub PAT 存入操作系统级凭据管理器（Windows Credential
# Manager / macOS Keychain / Linux keyutils），不再落到 WebView 的 localStorage 明文。
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
# MCP stdio 子进程的规格校验与帧纪律（crate 内纯逻辑；进程管理在本壳 tokio 层）。
process-supervisor = { path = "../../../crates/process-supervisor" }

[target.'cfg(target_os = "windows")'.dependencies]
# AtomCode enables SChannel alongside Rustls on Windows because browser/curl-native traffic can
# pass corporate or regional network paths that reset a Rustls-only TLS fingerprint. Feature
# unification preserves the cross-platform Rustls path while selecting Windows native TLS.
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
winreg = "0.55"

[lints.rust]
unsafe_code = "forbid"

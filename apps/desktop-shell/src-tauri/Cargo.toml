[package]
name = "awo-desktop-shell"
version = "0.1.0"
description = "AI Work OS Windows desktop shell"
authors = ["AI Work OS Development"]
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "awo_desktop_shell_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "awo-desktop-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[lints.rust]
unsafe_code = "forbid"

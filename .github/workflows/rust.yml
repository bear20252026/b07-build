name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check formatting
      working-directory: apps/desktop-shell/src-tauri
      run: cargo fmt --all -- --check
    - name: Build desktop shell crate
      working-directory: apps/desktop-shell/src-tauri
      run: cargo build --locked --verbose
    - name: Run desktop shell crate tests
      working-directory: apps/desktop-shell/src-tauri
      run: cargo test --locked --verbose

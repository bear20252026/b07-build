name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Grouped at the workflow level on purpose: job-level concurrency is evaluated
# before the matrix expands, so referencing matrix.* there makes the file invalid.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

# One job per crate so a formatting nit in the native host helper cannot hide a
# test failure in the desktop shell. The desktop shell is the only entry that needs
# system libraries on Linux, because it is the only one that links Tauri and
# WebKitGTK; Windows entries need no system deps.

jobs:
  check:
    name: ${{ matrix.crate }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: crates/process-supervisor
            os: ubuntu-latest
            system-deps: false
          - crate: crates/worktree
            os: ubuntu-latest
            system-deps: false
          - crate: crates/worktree
            os: windows-latest
            system-deps: false
          - crate: crates/windows-native-host-helper
            os: ubuntu-latest
            system-deps: false
          - crate: crates/windows-native-host-helper
            os: windows-latest
            system-deps: false
          # cdp-client 是纯协议逻辑（只依赖 serde/serde_json），两端行为必须一致：
          # 帧解析与端点白名单是安全判定，跨平台差异会表现为"Windows 上连得上、
          # Linux 上被拒"这类难复现的问题，故两边都跑。
          - crate: crates/cdp-client
            os: ubuntu-latest
            system-deps: false
          - crate: crates/cdp-client
            os: windows-latest
            system-deps: false
          # cdp-transport 是 CDP 的 WebSocket 传输层：它把 cdp-client 的纯判定
          # 落到真实 IO。跨平台差异在这里最可能出现（TCP 关闭语义、内核写缓冲
          # 行为不同——本批就在 Windows 上观察到"对端消失后写入仍成功、失败在
          # 下一次读时才浮现"），故两端都跑。它的集成测试会在
          # 127.0.0.1 上起一个真的 WebSocket 服务端，无需系统依赖。
          - crate: crates/cdp-transport
            os: ubuntu-latest
            system-deps: false
          - crate: crates/cdp-transport
            os: windows-latest
            system-deps: false
          - crate: apps/desktop-shell/src-tauri
            os: ubuntu-latest
            system-deps: true
          # Windows 是桌面端的主要交付平台：fmt/clippy/test 必须与 Linux 一样
          # 在 Windows 上真实跑一遍（R2 审计 05 的跨平台验收要求）。
          # Tauri 的 Windows 构建不需要 Linux 系统库；符号链接用例在未开
          # 开发者模式时按设计自动跳过。
          - crate: apps/desktop-shell/src-tauri
            os: windows-latest
            system-deps: false

    defaults:
      run:
        working-directory: ${{ matrix.crate }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up stable Rust with rustfmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Install Tauri Linux build dependencies
        if: matrix.system-deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests against the committed lockfile
        run: cargo test --locked

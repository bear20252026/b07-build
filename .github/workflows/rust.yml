name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Grouped at the workflow level on purpose: job-level concurrency is evaluated
# before the matrix expands, so referencing matrix.* there makes the file invalid.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

# One job per crate so a formatting nit in the native host helper cannot hide a
# test failure in the desktop shell. The desktop shell is the only entry that needs
# system libraries on Linux, because it is the only one that links Tauri and
# WebKitGTK; Windows entries need no system deps.

jobs:
  check:
    name: ${{ matrix.crate }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: crates/process-supervisor
            os: ubuntu-latest
            system-deps: false
          - crate: crates/worktree
            os: ubuntu-latest
            system-deps: false
          - crate: crates/worktree
            os: windows-latest
            system-deps: false
          - crate: crates/windows-native-host-helper
            os: ubuntu-latest
            system-deps: false
          - crate: crates/windows-native-host-helper
            os: windows-latest
            system-deps: false
          - crate: apps/desktop-shell/src-tauri
            os: ubuntu-latest
            system-deps: true
          # Windows 是桌面端的主要交付平台：fmt/clippy/test 必须与 Linux 一样
          # 在 Windows 上真实跑一遍（R2 审计 05 的跨平台验收要求）。
          # Tauri 的 Windows 构建不需要 Linux 系统库；符号链接用例在未开
          # 开发者模式时按设计自动跳过。
          - crate: apps/desktop-shell/src-tauri
            os: windows-latest
            system-deps: false

    defaults:
      run:
        working-directory: ${{ matrix.crate }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up stable Rust with rustfmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Install Tauri Linux build dependencies
        if: matrix.system-deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests against the committed lockfile
        run: cargo test --locked

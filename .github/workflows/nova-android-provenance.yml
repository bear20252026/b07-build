name: NOVA Android candidate provenance

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-android-candidate:
    name: Build NOVA Android aarch64 APK and universal AAB candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 17 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up stable Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK for the remote build
        shell: bash
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018'
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/.android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Verify source boundaries before mobile generation
        run: |
          npm run architecture:check
          npm run typecheck
          node --experimental-sqlite --import tsx --test apps/desktop-shell/test/desktop-shell-contract.test.ts

      - name: Build Workbench static assets before Android generation
        run: npm run build --workspace=@awo/workbench

      - name: Verify WebView asset payload before Android generation
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/workbench/dist/index.html
          test -d apps/workbench/dist/assets
          test -n "$(find apps/workbench/dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"

      - name: Initialize Android Studio project in the remote workspace
        run: npm run android:init

      - name: Build aarch64 APK candidate
        run: npm run android:build:apk

      - name: Build universal AAB candidate
        run: npm run android:build:aab

      - name: Verify Android WebView asset payload before signing
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find apps/desktop-shell/src-tauri/gen/android/app/build/outputs/apk/universal/release -type f -name 'app-universal-release-unsigned.apk' | sort | head -n 1)
          test -n "$apk" && test -f "$apk"
          native_lib='lib/arm64-v8a/libawo_desktop_shell_lib.so'
          unzip -l "$apk" | grep -q " $native_lib$"
          unzip -p "$apk" "$native_lib" | strings | grep -q 'index.html'
          unzip -p "$apk" "$native_lib" | strings | grep -q 'react-vendor'

      - name: Create ephemeral candidate signing key and package Android candidates
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop-shell/package.json').version")
          stage="$RUNNER_TEMP/nova-android-candidate"
          signing_dir="$RUNNER_TEMP/nova-android-signing"
          keystore="$signing_dir/candidate-release.jks"
          mkdir -p "$stage" "$signing_dir"
          keytool -genkeypair \
            -keystore "$keystore" \
            -storepass android \
            -keypass android \
            -alias nova-android-candidate \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname 'CN=NOVA Android Candidate, O=NOVA, C=US' \
            -noprompt
          build_tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          test -n "$build_tools_dir"
          zipalign_bin="$ANDROID_HOME/build-tools/$build_tools_dir/zipalign"
          apksigner_bin="$ANDROID_HOME/build-tools/$build_tools_dir/apksigner"
          test -x "$zipalign_bin" && test -x "$apksigner_bin"
          # Tauri's aarch64-only APK still uses Gradle's universal output directory.
          # The workflow controls the architecture through `tauri android build --target aarch64`.
          apk=$(find apps/desktop-shell/src-tauri/gen/android/app/build/outputs/apk/universal/release -type f -name 'app-universal-release-unsigned.apk' | sort | head -n 1)
          test -n "$apk" && test -f "$apk"
          apk_output="$stage/NOVA_${version}_aarch64-candidate.apk"
          "$zipalign_bin" -f -p 4 "$apk" "$apk_output.aligned"
          "$apksigner_bin" sign \
            --ks "$keystore" \
            --ks-key-alias nova-android-candidate \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$apk_output" \
            "$apk_output.aligned"
          "$apksigner_bin" verify --verbose --print-certs "$apk_output"
          rm -f "$apk_output.aligned"
          aab=$(find apps/desktop-shell/src-tauri/gen/android/app/build/outputs/bundle -type f -name '*release*.aab' | sort | head -n 1)
          test -n "$aab" && test -f "$aab"
          aab_output="$stage/NOVA_${version}_universal-candidate.aab"
          jarsigner -keystore "$keystore" -storepass android -keypass android -signedjar "$aab_output" "$aab" nova-android-candidate
          # The candidate key is intentionally self-signed and removed after this job.
          # Verify JAR integrity without requiring an external PKIX trust chain.
          jarsigner -verify -verbose "$aab_output"
          python3 - <<'PY' "$stage" "$version" "$GITHUB_SHA"
          import hashlib
          import json
          import os
          import sys
          stage, version, source_revision = sys.argv[1:]
          files = []
          for name in sorted(os.listdir(stage)):
              if not name.endswith(('.apk', '.aab')):
                  continue
              path = os.path.join(stage, name)
              with open(path, 'rb') as handle:
                  digest = hashlib.sha256(handle.read()).hexdigest()
              files.append({'file': name, 'sha256': digest, 'bytes': os.path.getsize(path)})
          manifest = {
              'schemaVersion': 1,
              'product': 'NOVA',
              'version': version,
              'sourceRevision': source_revision,
              'platform': 'android',
              'artifactKind': 'android-apk-aab-candidate',
              'apkArchitecture': 'aarch64',
              'aabArchitectures': ['aarch64', 'armv7', 'i686', 'x86_64'],
              'signingStatus': 'ephemeral-test-signed-release-candidate',
              'publicTrust': False,
              'playStoreReady': False,
              'requiresExplicitRemoteProviderConfiguration': True,
              'directProviderTransport': 'rust-reqwest-https-sse',
              'includesWindowsGatewaySidecar': False,
              'includesDesktopCompanionCommands': False,
              'includesLocalPythonSearchRuntime': False,
              'excludedCapabilities': ['terminal', 'desktop-companion', 'desktop-save-as', 'local-python-search'],
              'files': files,
          }
          with open(os.path.join(stage, 'nova-android-candidate-manifest.json'), 'w', encoding='utf-8') as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
          PY
          rm -rf "$signing_dir"
          echo "artifact-directory=$stage" >> "$GITHUB_OUTPUT"

      - name: Upload NOVA Android candidates
        uses: actions/upload-artifact@v7
        with:
          name: nova-android-aarch64-apk-and-universal-aab-candidate
          if-no-files-found: error
          path: ${{ steps.package.outputs.artifact-directory }}

      - name: Generate build provenance for NOVA Android candidates
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ steps.package.outputs.artifact-directory }}/*.apk
            ${{ steps.package.outputs.artifact-directory }}/*.aab

  android-emulator-smoke:
    name: Smoke test NOVA Android WebView startup on x86_64 emulator
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 17 for Android emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up stable Rust with Android x86_64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and emulator image
        shell: bash
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'system-images;android-35;google_apis;x86_64'
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/.android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Build Workbench static assets for mobile WebView
        run: npm run build --workspace=@awo/workbench

      - name: Initialize Android Studio project
        run: npm run android:init

      - name: Build x86_64 APK for emulator startup test
        run: npm exec --workspace=@awo/desktop-shell -- tauri android build --apk --target x86_64

      - name: Prepare Android emulator startup evidence directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/nova-android-emulator-smoke"

      - name: Install and open NOVA on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: sh .github/scripts/run-nova-android-emulator-smoke.sh

      - name: Upload Android emulator startup evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nova-android-emulator-startup-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/nova-android-emulator-smoke

name: Secret scan

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

# Provider credentials are the highest-value secret in this repository: the
# workbench stores them per provider and sends them to third-party model APIs.
# Full history is scanned, not just the diff, so a key committed and later
# "removed" in a follow-up commit still gets reported.

jobs:
  gitleaks:
    name: Scan repository history for credentials
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

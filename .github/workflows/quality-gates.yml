name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

# This workflow is the fast feedback gate: types, module boundaries, unit tests,
# dependency advisories, and sidecar syntax. Slower gates (Rust matrix, workbench
# build budget, Node compatibility) live in their own workflows so a failure here
# points at one thing instead of burying it in a long log.

jobs:
  typescript:
    name: TypeScript types, architecture, and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Check module boundaries
        run: npm run architecture:check

      # Each app owns a typecheck project. The root tsconfig.base.json covers the
      # shared packages plus app sources; the workbench project additionally carries
      # JSX and its whole test directory (fixtures there were previously checked by
      # nothing, so contract drift only showed up at runtime), and the desktop shell
      # owns its contract tests.
      - name: Check TypeScript types (shared packages and app sources)
        run: npm run typecheck

      - name: Check TypeScript types (workbench React surface and tests)
        run: npm run typecheck --workspace=@awo/workbench

      - name: Check TypeScript types (desktop shell contract tests)
        run: npm run desktop:typecheck

      - name: Check desktop release version consistency
        run: npm run version:check

      - name: Run unit tests
        run: npm run test:unit

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm audit resolves the dependency tree from package-lock.json, so the
      # pinned fast-uri version is what keeps this gate green. Install first so the
      # lockfile is provably in sync with package.json before it is audited.
      - name: Install locked workspace dependencies
        run: npm ci

      - name: Fail on high or critical advisories
        run: npm audit --omit=dev --audit-level=high

  python:
    name: Python sidecar syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile sidecars
        run: python -m compileall -q sidecars
